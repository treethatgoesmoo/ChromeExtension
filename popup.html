<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Media Controller</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Media Controller</h1>
      <div id="status" class="status">
        <span id="tabCount">0</span> tab(s) with media
      </div>
    </header>

    <div class="controls">
      <!-- Playback Controls -->
      <div class="control-section">
        <h2>Playback</h2>
        <div class="button-group">
          <button id="previousBtn" class="control-btn" title="Previous/Rewind">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
            </svg>
          </button>
          <button id="playPauseBtn" class="control-btn primary" title="Play/Pause">
            <svg id="playIcon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <svg id="pauseIcon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
              <path d="M6 4h4v16H6zm8 0h4v16h-4z"/>
            </svg>
          </button>
          <button id="nextBtn" class="control-btn" title="Next/Fast Forward">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Volume Controls -->
      <div class="control-section">
        <h2>Volume</h2>
        <div class="volume-controls">
          <button id="muteBtn" class="control-btn small" title="Mute">
            <svg id="volumeIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
            </svg>
            <svg id="mutedIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
              <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
          </button>
          <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="100">
          <span id="volumeValue" class="volume-value">100%</span>
        </div>
        <div class="button-group small-btns">
          <button id="volumeDownBtn" class="control-btn small" title="Volume Down">-</button>
          <button id="volumeUpBtn" class="control-btn small" title="Volume Up">+</button>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="control-section">
        <h2>Quick Actions</h2>
        <div class="button-group">
          <button id="seekBackBtn" class="control-btn small" title="Rewind 10s">-10s</button>
          <button id="seekForwardBtn" class="control-btn small" title="Forward 10s">+10s</button>
        </div>
      </div>

      <!-- Tabs with Media -->
      <div class="control-section">
        <h2>Active Media Tabs</h2>
        <div id="tabList" class="tab-list">
          <p class="no-media">No media detected</p>
        </div>
      </div>
    </div>

    <footer>
      <button id="refreshBtn" class="refresh-btn">Refresh</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
